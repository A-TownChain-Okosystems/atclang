name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Dependency Review is applicable only to repositories where the GitHub
# Dependency Graph is explicitly enabled. Set the repository variable
# ATC_DEPENDENCY_GRAPH_ENABLED=true to activate this gate.
jobs:
  dependency-review:
    if: ${{ vars.ATC_DEPENDENCY_GRAPH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

  dependency-review-not-applicable:
    if: ${{ vars.ATC_DEPENDENCY_GRAPH_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Record non-applicability
        run: |
          echo "Dependency Review skipped: GitHub Dependency Graph is not enabled for this repository."
          echo "Set repository variable ATC_DEPENDENCY_GRAPH_ENABLED=true when Dependency Graph is enabled and the gate becomes applicable."
