# ATC Code Quality Gate — ATC-STD-081 (Coding) / ATC-STD-082 (Code Style)
# Rust-only seit 2026-09-17: kanonischer Kern crates/atc-core.
# Python-Governance-Werkzeuge (tools/) bleiben ruff-gepinnt 0.16.7.
name: ATC Code Quality (STD-081/082)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve execution SHA
        shell: bash
        run: |
          set -euo pipefail
          SHA="${{ github.event.pull_request.head.sha }}"
          if [ -z "$SHA" ]; then
            echo "::error::pull_request.head.sha is empty; refusing execution"
            exit 1
          fi
          echo "Executing SHA: $SHA"
          echo "EXECUTION_SHA=$SHA" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify execution SHA
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="${{ github.event.pull_request.head.sha }}"
          echo "Expected SHA: $EXPECTED"
          echo "Actual SHA:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Execution SHA mismatch"
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.11'}
      - name: Ruff installieren (gepinnt, ATC-STD-CI-001/CI-004)
        run: pip install ruff==0.16.7
      - name: Lint-Pruefung tools/ (ATC-STD-081)
        run: ruff check tools/
      - name: Format-Pruefung tools/ (ATC-STD-082)
        run: ruff format --check tools/
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master@2026-06-30
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Rust-Format (ATC-STD-082)
        run: cargo fmt --manifest-path crates/atc-core/Cargo.toml -- --check
      - name: Rust-Clippy (ATC-STD-081)
        run: cargo clippy --manifest-path crates/atc-core/Cargo.toml --all-targets -- -D warnings
