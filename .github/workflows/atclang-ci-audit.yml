name: ATCLang CI Audit — Governance, Security, Consistency

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-audit:
    name: Fail-closed repository audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run ATCLang compliance audit
        run: python3 tools/audit/atclang_ci_audit.py

  python-syntax:
    name: Python syntax gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: python3 -m compileall -q src tests tools

  security-static:
    name: Static security boundary gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject obvious executable security stubs
        run: |
          set -eu
          if grep -RInE 'ECDSA Simulation|sig_.*startswith|return True[[:space:]]*#[[:space:]]*Simulation|status.*200.*handler' src --include='*.py'; then
            echo 'FAIL: executable reference security stubs detected'
            exit 1
          fi
          if grep -RInE '^# STUB:' src --include='*.py' --include='*.rs'; then
            echo 'FAIL: executable STUB marker detected'
            exit 1
          fi
          echo 'PASS: no targeted executable security stubs detected'
