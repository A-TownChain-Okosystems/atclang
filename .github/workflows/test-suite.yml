name: ATC Test Suite
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write

jobs:
  npm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: npm install + test/build (SCR-0078)
        run: |
          set +e
          FAIL=0
          while IFS= read -r f; do
            d="$(dirname "$f")"
            echo "=== npm in $d"
            (cd "$d" && npm install --no-audit --no-fund --silent)
            (cd "$d" && npm test --if-present --silent) || { echo "npm test FAILED in $d"; FAIL=1; }
            (cd "$d" && npm run build --if-present --silent) || { echo "npm build FAILED in $d"; FAIL=1; }
          done < <(find . -name package.json -not -path "*/archive/*" -not -path "*/node_modules/*" -not -path "*/.*/")
          exit $FAIL
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: pytest ueber alle Requirements-Module (SCR-0078)
        run: |
          set +e
          FAIL=0
          while IFS= read -r f; do
            d="$(dirname "$f")"
            if ! (cd "$d" && grep -rql --include="*.py" "def test_" .); then
              echo "SKIP $d: keine Tests vorhanden"; continue
            fi
            echo "=== pytest in $d"
            (cd "$d" && pip install -q -r requirements.txt pytest && python -m pytest -q --no-header) \
              || { echo "pytest FAILED in $d"; FAIL=1; }
          done < <(find . -name requirements.txt -not -path "*/archive/*")
          exit $FAIL
      - name: Evidence-Bindung (SCR-0081, bound_commit + test_run)
        if: success()
        run: |
          python3 - <<'PY'
          import os, datetime
          sha = os.environ["GITHUB_SHA"]
          rid = os.environ["GITHUB_RUN_ID"]
          p = ".atc/evidence/evidence.yaml"
          t = open(p, encoding="utf-8").read()
          t = t.replace("bound_commit: pending", "bound_commit: " + sha)
          if "test_run:" not in t:
              t = t.rstrip() + "\n"
              t += "test_run:\n"
              t += "  workflow: " + os.environ.get("GITHUB_WORKFLOW", "ATC Test Suite") + "\n"
              t += "  run_id: " + rid + "\n"
              t += "  commit: " + sha + "\n"
              t += "  timestamp: " + datetime.datetime.now(datetime.timezone.utc).isoformat() + "\n"
              t += "  result: PASS\n"
              t += "  runner: github-actions\n"
              open(p, "w", encoding="utf-8").write(t)
          PY
          git config user.name "Aurora-Bot"
          git config user.email "aurora@base44.ai"
          git add .atc/evidence/evidence.yaml
          git commit -m "chore(evidence): bound_commit auto + test_run PASS (SCR-0081) [skip ci]" || echo "nichts zu committen"
          git push || echo "EVIDENCE_PUSH_BLOCKED"
