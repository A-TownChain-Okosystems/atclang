name: CI-Independent ATCLang Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Python syntax
        run: python3 -m compileall -q src tests tools
      - name: Independent governance/security audit
        run: python3 tools/ci_independent_audit.py
      - name: Reference tests
        run: python3 -m pytest -q
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master@2026-06-30
        with:
          toolchain: stable
      - name: Rust canonical core
        run: cargo test --manifest-path crates/atc-core/Cargo.toml --quiet
