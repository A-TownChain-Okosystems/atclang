name: CI-Independent ATCLang Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve execution SHA
        shell: bash
        run: |
          set -euo pipefail
          SHA="${{ github.event.pull_request.head.sha }}"
          if [ -z "$SHA" ]; then
            echo "::error::pull_request.head.sha is empty; refusing execution"
            exit 1
          fi
          echo "Executing SHA: $SHA"
          echo "EXECUTION_SHA=$SHA" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify execution SHA
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="${{ github.event.pull_request.head.sha }}"
          echo "Expected SHA: $EXPECTED"
          echo "Actual SHA:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Execution SHA mismatch"
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Python syntax
        run: python3 -m compileall -q tools
      - name: Independent governance/security audit
        run: python3 tools/ci_independent_audit.py
  core-test:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve execution SHA
        shell: bash
        run: |
          set -euo pipefail
          SHA="${{ github.event.pull_request.head.sha }}"
          if [ -z "$SHA" ]; then
            echo "::error::pull_request.head.sha is empty; refusing execution"
            exit 1
          fi
          echo "Executing SHA: $SHA"
          echo "EXECUTION_SHA=$SHA" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify execution SHA
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="${{ github.event.pull_request.head.sha }}"
          echo "Expected SHA: $EXPECTED"
          echo "Actual SHA:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Execution SHA mismatch"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master@2026-06-30
        with:
          toolchain: stable
      - name: Rust canonical core
        run: cargo test --manifest-path crates/atc-core/Cargo.toml --quiet
