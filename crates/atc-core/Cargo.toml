[package]
name = "atc-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "ATCLang Canonical Core (Rust) — lexer/parser and production security boundary"

[dependencies]
base64 = "0.22.1"
p256 = { version = "0.13.2", features = ["ecdsa"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.17"
